<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login - Ambalika Institute</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='body.css') }}">
</head>
<body>

<header>
    <h1>Ambalika Institute of Management & Technology</h1>
    <p>Student Login Portal</p>
</header>

<div class="container">
    <div class="login-box">
        <h2>Student Login</h2>

        <input type="text" id="roll" placeholder="Enter Roll Number">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Login</button>

        <p id="error-msg"></p>
    </div>
</div>

<footer>
    <p>© 2025 Ambalika Institute</p>
</footer>

<script src="{{ url_for('static', filename='scriptt.js') }}"></script>
</body>
</html>
